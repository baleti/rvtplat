[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rvtplat"
version = "0.1.0"
requires-python = ">=3.9"
description = "Cross-platform helpers (dirs, atomic writes, browser launch, capped subprocesses) for the rvt/dwg tools"

[tool.setuptools]
packages = ["rvtplat"]
